<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Apuestas Harold José</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-28">

    <header class="bg-white shadow-sm py-3 px-4 text-center sticky top-0 z-50 border-b border-sky-100">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2 py-1 rounded-lg">v4.2 PRO CONTROL</span>
            <div>
                <h1 class="text-sm font-bold text-sky-900">Harold José</h1>
                <p class="text-[9px] text-slate-500">Sistema de Pagos y Clientes</p>
            </div>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <section id="view-pagos" class="tab-view space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice-dollar text-sky-600"></i> Registrar Pago Recibido
                </h2>
                
                <div class="border-2 border-dashed border-sky-300 rounded-xl p-4 text-center bg-sky-50/50 space-y-2">
                    <div class="text-sky-600 text-2xl">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <p id="uploadText" class="text-xs text-slate-600 font-medium">Sube captura o presiona <span class="bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded font-bold">Ctrl+V</span> aquí</p>
                    
                    <input type="file" id="fileInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-700 cursor-pointer">
                </div>

                <div id="previewContainer" class="hidden mt-3 text-center space-y-3">
                    <img id="imagePreview" src="" alt="Vista previa" class="max-h-40 mx-auto rounded-lg shadow-sm border">
                    <p id="fileName" class="text-xs text-slate-500 font-medium"></p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <div class="bg-sky-50 border border-sky-200 text-sky-800 text-xs py-2 px-3 rounded-xl font-medium flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-sky-600"></i> Validador de Seguridad Anti-Fraude
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Número de Referencia / Operación</label>
                    <input type="text" id="refNumber" placeholder="Lectura automática o manual" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 font-bold text-sky-900">
                    <p id="dupWarning" class="text-[11px] text-red-600 font-bold mt-1.5 hidden bg-red-50 p-2 rounded-lg border border-red-200"><i class="fa-solid fa-triangle-exclamation"></i> <span id="dupWarningText">Pago ya utilizado</span></p>
                    <p id="authWarning" class="text-[11px] text-amber-600 font-bold mt-1.5 hidden bg-amber-50 p-2 rounded-lg border border-amber-200"><i class="fa-solid fa-circle-exclamation"></i> <span id="authWarningText">Verificar datos del titular o banco receptor.</span></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Cliente</label>
                    <input type="text" id="clientName" placeholder="Nombre o alias" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Monto del Pago (Bolívares - Bs)</label>
                    <input type="number" step="0.01" id="paymentAmount" placeholder="Ej. 500.00" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Banco Receptor</label>
                    <select id="paymentBank" class="w-full text-xs p-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="
