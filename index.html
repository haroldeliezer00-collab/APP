<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harold José - Taquilla</title>
    <style>
        :root { --primary: #1e1b4b; --accent: #10b981; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; padding-bottom: 70px; color: var(--text); }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Configuración de enlace Nube */
        .config-box { background: #eff6ff; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #bfdbfe; font-size: 11px; }
        .config-box input { width: 100%; padding: 6px; border: 1px solid #93c5fd; border-radius: 4px; margin-top: 4px; box-sizing: border-box; }

        /* Tarjeta Principal */
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        /* Área de Carga / Pegar Comprobante */
        .upload-area { border: 2px dashed #93c5fd; background: #f0fdf4; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .upload-area:hover { background: #dcfce7; }
        .upload-area p { margin: 8px 0 0; font-size: 12px; color: #166534; font-weight: bold; }
        
        /* Validador Antifraude Banner */
        .anti-fraud-badge { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: #166534; font-weight: bold; display: flex; align-items: center; gap: 6px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 4px; color: #475569; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box; background: #fff; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }

        .btn-success { background: var(--accent); color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; transition: background 0.2s; }
        .btn-success:hover { background: #059669; }

        /* Barra de Navegación Inferior (Fija) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid #e2e8f0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 0; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); z-index: 1000; }
        .nav-item { text-align: center; font-size: 10px; color: #64748b; text-decoration: none; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: #0284c7; }
        .nav-item span { display: block; font-size: 16px; margin-bottom: 2px; }

        /* Mensajes de Alerta Antifraude */
        #alertBox { padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; display: none; font-weight: bold; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    </style>
</head>
<body onpaste="manejarPegado(event)">

<div class="container">
    
    <!-- Configuración del enlace de Google Sheets (Tu puente a la nube) -->
    <div class="config-box">
        <label>Enlace de Conexión Nube (Google Apps Script):</label>
        <input type="text" id="apiUrl" placeholder="Pega aquí tu URL de Apps Script...">
    </div>

    <div id="alertBox"></div>

    <!-- Pantalla 1: Pagos -->
    <div class="card">
        <div style="font-weight: bold; font-size: 15px; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
            <span>💵</span> Registrar Pago Taquilla
        </div>
        
        <!-- Zona de Carga / Pegar Comprobante con Ctrl+V -->
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span style="font-size: 24px;">☁️</span>
            <p>Sube captura o presiona <b>Ctrl+V</b> aquí</p>
            <input type="file" id="fileInput" style="display:none;" onchange="cargarCaptura(event)">
            <div id="fileName" style="font-size: 11px; color: #64748b; margin-top: 4px;">No se ha seleccionado ningún archivo</div>
        </div>

        <div class="anti-fraud-badge">
            <span>🛡️</span> Validador Anti-Fraude Estricto (Verifica Duplicados en Nube)
        </div>

        <div class="form-group">
            <label>Número de Referencia / Operación</label>
            <input type="text" id="referencia" placeholder="Ej. 00684939">
        </div>

        <div class="form-group">
            <label>Nombre del Cliente</label>
            <input type="text" id="cliente" placeholder="Ej. Norys Luzon">
        </div>

        <div class="form-group">
            <label>Monto del Pago (Bolívares - Bs)</label>
            <input type="number" id="monto" placeholder="Ej. 500.00">
        </div>

        <button class="btn-success" onclick="guardarPagoTaquilla()">Guardar Pago Taquilla</button>
    </div>

</div>

<!-- Barra de Navegación Inferior -->
<nav class="bottom-nav">
    <div class="nav-item active"><span>🏠</span>Pagos</div>
    <div class="nav-item" onclick="alert('Sección Caja en desarrollo en el siguiente paso')"><span>📊</span>Caja</div>
    <div class="nav-item" onclick="alert('Sección Sistemas en desarrollo')"><span>📈</span>Sistemas</div>
    <div class="nav-item" onclick="alert('Sección Clientes en desarrollo')"><span>👥</span>Clientes</div>
    <div class="nav-item" onclick="alert('Sección Cuentas en desarrollo')"><span>🏦</span>Cuentas</div>
</nav>

<script>
    // Recordar URL de la nube en el navegador
    window.onload = function() {
        const savedUrl = localStorage.getItem('taquilla_url');
        if (savedUrl) document.getElementById('apiUrl').value = savedUrl;
    };

    // Función para manejar Ctrl+V (Pegar imagen/comprobante)
    function manejarPegado(event) {
        const items = (event.clipboardData || event.originalEvent.clipboardData).items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf("image") !== -1) {
                const blob = items[i].getAsFile();
                document.getElementById('fileName').innerText = "Imagen pegada del portapapeles con éxito (" + blob.name + ")";
                // Aquí se simula la lectura OCR rápida de referencia si quisieras integrarlo
                break;
            }
        }
    }

    function cargarCaptura(event) {
        if(event.target.files.length > 0) {
            document.getElementById('fileName').innerText = event.target.files[0].name;
        }
    }

    // Guardar y Validar Antifraude contra la Nube
    function guardarPagoTaquilla() {
        const url = document.getElementById('apiUrl').value.trim();
        const referencia = document.getElementById('referencia').value.trim();
        const cliente = document.getElementById('cliente').value.trim();
        const monto = document.getElementById('monto').value.trim();
        const alertBox = document.getElementById('alertBox');

        if (!url) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert-error';
            alertBox.innerText = '¡Falta el enlace de Google Apps Script arriba para validar contra fraudes!';
            return;
        }

        if (!referencia || !cliente || !monto) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert-error';
            alertBox.innerText = 'Por favor completa todos los campos (Referencia, Cliente y Monto).';
            return;
        }

        localStorage.setItem('taquilla_url', url);
        alertBox.style.display = 'block';
        alertBox.className = 'alert-success';
        alertBox.innerText = 'Verificando referencia en la nube (Antifraude)...';

        const datos = {
            accion: "registrar",
            referencia: referencia,
            cliente: cliente,
            monto: monto
        };

        // Envía los datos al script de Google Sheets para verificar duplicados en vivo
        fetch(url, {
            method: "POST",
            mode: "no-cors", // O cors si configuras cabeceras en Google
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
        })
        .then(() => {
            alertBox.className = 'alert-success';
            alertBox.innerText = '¡Pago registrado y validado con éxito!';
            document.getElementById('referencia').value = '';
            document.getElementById('cliente').value = '';
            document.getElementById('monto').value = '';
            document.getElementById('fileName').innerText = 'No se ha seleccionado ningún archivo';
        })
        .catch(() => {
            alertBox.className = 'alert-error';
            alertBox.innerText = 'Error de conexión con la nube.';
        });
    }
</script>

</body>
</html>
